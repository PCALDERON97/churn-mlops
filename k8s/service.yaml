apiVersion: v1
kind: Service
metadata:
  name: churn-api
  namespace: churn
spec:
  type: NodePort # accesible desde la máquina: http://localhost:30080 en Docker Desktop
  selector:
    app: churn-api # reparte el tráfico entre todos los pods con esta etiqueta
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
